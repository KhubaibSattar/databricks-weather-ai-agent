command: ["streamlit", "run", "weather_agent.py", "--server.port", "8501"]

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "databse-hw2"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-weather-url"
  - name: NWS_API_BASE_URL
    value: "https://api.weather.gov"
  - name: LOCATION_TABLE_NAME
    value: "default.weather_locations"
  - name: WEATHER_DOCUMENTS_TABLE_NAME
    value: "default.weather_documents"
  - name: CHUNK_EMBEDDINGS_TABLE_NAME
    value: "default.chunk_embeddings"
  - name: EMBEDDING_MODEL_NAME
    value: "sentence-transformers/all-MiniLM-L6-v2"